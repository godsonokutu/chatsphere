name: Native preview

on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/native-preview.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  EXPO_NO_DOTENV: "1"
  EXPO_PUBLIC_APP_VARIANT: preview

jobs:
  android:
    name: Android APK and emulator UI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test
      - run: npx expo prebuild --platform android --no-install
      - name: Compile self-contained preview APK
        run: |
          set -o pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon --max-workers=2 2>&1 | tee ../android-build.log
      - name: Package preview and integrity evidence
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/ChatSphere-Preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/ChatSphere-Preview.apk > artifacts/android-signature.txt
          (cd artifacts && sha256sum ChatSphere-Preview.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ChatSphere-Android-Preview
          path: mobile/artifacts/
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise native preview UI
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: mobile
          script: |
            adb install artifacts/ChatSphere-Preview.apk
            python3 scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-evidence
          path: |
            mobile/android-build.log
            mobile/android-ui.xml
            mobile/ui-output/
          if-no-files-found: ignore
      - if: always()
        run: echo 'Self-contained sample-only APK, signed with the generated Android debug certificate. Native emulator UI only; no live API, native session storage, physical phone or production signing claim.' >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS simulator build and UI
    runs-on: macos-26-intel
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: xcodebuild -version && xcrun simctl list runtimes
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install --project-directory=ios 2>&1 | tee ios-pods.log
      - name: Compile simulator app
        run: |
          set -o pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          scheme="$(xcodebuild -list -json -workspace "$workspace" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const name=JSON.parse(s).workspace.schemes.find(s=>s.startsWith("ChatSphere"));if(!name)process.exit(1);console.log(name)})')"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios-build.log
      - name: Package simulator app
        run: |
          mkdir -p artifacts
          app="$(find ios-build/Build/Products/Release-iphonesimulator -maxdepth 1 -name 'ChatSphere*.app' -print -quit)"
          test -n "$app"
          ditto -c -k --keepParent "$app" artifacts/ChatSphere-iOS-Simulator.zip
          (cd artifacts && shasum -a 256 ChatSphere-iOS-Simulator.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ChatSphere-iOS-Simulator
          path: mobile/artifacts/
          retention-days: 30
      - name: Boot simulator and exercise native UI
        run: |
          simulator="$(xcrun simctl list devices available -j | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const device=Object.values(JSON.parse(s).devices).flat().find(d=>d.name.startsWith("iPhone"));if(!device)process.exit(1);console.log(device.udid)})')"
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
          app="$(find ios-build/Build/Products/Release-iphonesimulator -maxdepth 1 -name 'ChatSphere*.app' -print -quit)"
          xcrun simctl install "$simulator" "$app"
          ruby scripts/add-ios-smoke.rb
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          xcodebuild -workspace "$workspace" -scheme ChatSphereNativeSmoke -configuration Release -destination "platform=iOS Simulator,id=$simulator" -derivedDataPath ios-build -resultBundlePath ios-smoke.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ios-ui.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-evidence
          path: |
            mobile/ios-pods.log
            mobile/ios-build.log
            mobile/ios-ui.log
            mobile/ios-smoke.xcresult/
            mobile/ui-output/
          if-no-files-found: ignore
      - if: always()
        run: echo 'Unsigned sample-only simulator app and native simulator UI. This archive cannot be installed on a physical iPhone. No IPA, provisioning, native session storage or external provider claim.' >> "$GITHUB_STEP_SUMMARY"
